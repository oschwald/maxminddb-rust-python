name: Benchmark

on:
  workflow_dispatch:
    inputs:
      baseline-ref:
        description: Git ref to compare against
        required: true
        default: origin/main
      candidate-ref:
        description: Git ref to benchmark as the candidate
        required: true
        default: HEAD
      count:
        description: Number of operations per benchmark sample
        required: true
        default: "1000000"
      repeats:
        description: Number of measured samples
        required: true
        default: "11"
      warmups:
        description: Number of warmup samples
        required: true
        default: "2"
      max-regression-pct:
        description: Maximum allowed median regression percentage
        required: true
        default: "5"

permissions:
  contents: read

jobs:
  compare:
    name: Compare refs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run benchmark comparison
        env:
          BASELINE_REF: ${{ inputs.baseline-ref }}
          CANDIDATE_REF: ${{ inputs.candidate-ref }}
          COUNT: ${{ inputs.count }}
          MAX_REGRESSION_PCT: ${{ inputs.max-regression-pct }}
          REPEATS: ${{ inputs.repeats }}
          WARMUPS: ${{ inputs.warmups }}
        run: |
          uv run python benchmarks/compare_refs.py \
            --baseline-ref "$BASELINE_REF" \
            --candidate-ref "$CANDIDATE_REF" \
            --file tests/data/test-data/GeoIP2-City-Test.mmdb \
            --workload database-hits \
            --count "$COUNT" \
            --repeats "$REPEATS" \
            --warmups "$WARMUPS" \
            --max-regression-pct "$MAX_REGRESSION_PCT" \
            --json-output benchmark-results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-results
          path: benchmark-results.json
          if-no-files-found: ignore
