---
name: Test

on:
  push:
  pull_request:
  schedule:
    - cron: "3 15 * * SUN"

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Build and install extension
        run: |
          pip install maturin
          maturin build --release
          pip install --no-index --find-links target/wheels maxminddb-rust

      - name: Run tests
        run: pytest -v tests/

  test-free-threaded:
    name: Test free-threaded Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14t", "3.15t"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up free-threaded Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest

      - name: Build and install extension
        run: |
          maturin build --release
          pip install --no-index --find-links target/wheels maxminddb-rust

      - name: Verify free-threading remains enabled
        run: >-
          python -c "import sys; import maxminddb_rust;
          assert not sys._is_gil_enabled()"

      - name: Run tests
        run: pytest -v tests/

      - name: Exercise parallel lookups
        run: >-
          python benchmarks/benchmark_parallel.py
          --file tests/data/test-data/GeoIP2-City-Test.mmdb
          --count 100000 --workers 1,2,4
