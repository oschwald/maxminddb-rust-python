[build-system]
requires = ["maturin>=1.9.2,<2.0"]
build-backend = "maturin"

[project]
name = "maxminddb-rust"
version = "0.9.0"
description = "Fast reader for MaxMind DB files, API-compatible with maxminddb and written in Rust"
readme = "README.md"
authors = [
    {name = "Gregory Oschwald", email = "oschwald@gmail.com"}
]
license = "ISC"
license-files = ["LICENSE"]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: WebAssembly :: Emscripten",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Topic :: Internet",
    "Typing :: Typed",
]
keywords = ["maxmind", "maxminddb", "geoip", "geoip2", "geolocation", "ip-address", "mmdb"]

[project.urls]
Homepage = "https://github.com/oschwald/maxminddb-rust-python"
Repository = "https://github.com/oschwald/maxminddb-rust-python"
"Bug Tracker" = "https://github.com/oschwald/maxminddb-rust-python/issues"
Changelog = "https://github.com/oschwald/maxminddb-rust-python/blob/main/CHANGELOG.md"
"Migration Guide" = "https://github.com/oschwald/maxminddb-rust-python/blob/main/MIGRATION.md"
Contributing = "https://github.com/oschwald/maxminddb-rust-python/blob/main/CONTRIBUTING.md"

[project.optional-dependencies]
test = [
    "pytest>=8.4.2,<9.0.0; python_version < '3.10'",
    "pytest>=9.0.2; python_version >= '3.10'",
]

[tool.maturin]
include = ["maxminddb_rust.pyi", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--import-mode=importlib"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # The formatter handles trailing commas.
    "CPY001",  # Copyright headers are not required on every file.
    "D203",    # Conflicts with D211.
    "D213",    # Conflicts with D212.
]

[tool.ruff.lint.per-file-ignores]
# The stub is the Python-facing API documentation for the Rust extension.
"maxminddb_rust.pyi" = ["PYI021"]
# Test names describe their cases, and pytest uses assert for expectations.
"tests/*" = ["D", "S101"]
# Preserve the assertion style of the copied upstream unittest suite.
"tests/maxmind/*" = ["PT009", "PT027"]
# These programs intentionally print benchmark results and example output.
"benchmarks/*" = ["T201"]
"examples/*" = ["T201"]
# This helper is imported by directly executed scripts, not a package.
"benchmarks/_common.py" = ["INP001"]

[tool.uv]
cache-keys = [{file = "pyproject.toml"}, {file = "Cargo.toml"}, {file = "**/*.rs"}]
